name: K-X pagina completa + FastAPI HTTPS real (solo CI, sin motores)

on:
  push:
    branches:
      - feature/5-5k-portal-unico-invitado
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pagina-completa-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Frontend experimental, sin publicar
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Backend K-X experimental, sin desplegar
        uses: actions/checkout@v4
        with:
          repository: yori7v7/vehiculo_iot_api_dev
          ref: feature/5-5a-dispositivo-protocolo-aislado
          path: backend-kx
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias sólo runner
        run: |
          npm ci
          python -m pip install -r backend-kx/requirements.txt

      - name: Chrome y certificado raíz NSS
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chrome
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3-tools

      - name: HTTPS dos IP loopback y certificados de vida efímera
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kx/private" "$HOME/.pki/nssdb"
          chmod 700 "$RUNNER_TEMP/kx/private"
          # El proceso FastAPI CI usa root solo para enlazar HTTPS :443;
          # ownership.py exige que el directorio SQLite pertenezca al mismo UID.
          sudo chown root:root "$RUNNER_TEMP/kx/private"
          echo "KX_TEST_DIR=$RUNNER_TEMP/kx" >> "$GITHUB_ENV"
          echo "PUBLIC_VIRTUAL_ADMISSION_SQLITE_PATH=$RUNNER_TEMP/kx/private/tickets.sqlite3" >> "$GITHUB_ENV"
          echo "KX_SERVER_CRT=$RUNNER_TEMP/kx/api.crt" >> "$GITHUB_ENV"
          echo "KX_SERVER_KEY=$RUNNER_TEMP/kx/api.key" >> "$GITHUB_ENV"
          echo "KX_PAGES_CRT=$RUNNER_TEMP/kx/pages.crt" >> "$GITHUB_ENV"
          echo "KX_PAGES_KEY=$RUNNER_TEMP/kx/pages.key" >> "$GITHUB_ENV"
          echo "KX_ROOT_CA=$RUNNER_TEMP/kx/root.crt" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/kx/root.crt" >> "$GITHUB_ENV"
          echo "KX_CI_LAB=two-loopbacks-https" >> "$GITHUB_ENV"
          echo "APP_ENV=production" >> "$GITHUB_ENV"
          echo "PUBLIC_VIRTUAL_ADMISSION_ENABLED=true" >> "$GITHUB_ENV"
          echo "CONTROL_PUBLICO_ENABLED=false" >> "$GITHUB_ENV"
          echo "CONTROL_PUBLICO_SIMULATION=false" >> "$GITHUB_ENV"
          echo "DEVICE_LAB_ENABLED=false" >> "$GITHUB_ENV"
          test_key="$(openssl rand -hex 32)"
          echo "::add-mask::$test_key"
          echo "KX_ADMIN_TEST_KEY=$test_key" >> "$GITHUB_ENV"
          echo "API_KEY=$test_key" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes             -keyout "$RUNNER_TEMP/kx/root.key" -out "$RUNNER_TEMP/kx/root.crt"             -days 1 -subj "/CN=KX-runner-temporal-CA"             -addext "basicConstraints=critical,CA:TRUE"             -addext "keyUsage=critical,keyCertSign,cRLSign"
          for type in api pages; do
            if [ "$type" = "api" ]; then
              domain="100-30-4-62.nip.io"
            else
              domain="yori7v7.github.io"
            fi
            openssl req -new -newkey rsa:2048 -nodes               -keyout "$RUNNER_TEMP/kx/$type.key"               -out "$RUNNER_TEMP/kx/$type.csr" -subj "/CN=$domain"
            printf 'basicConstraints=critical,CA:FALSE\nsubjectAltName=DNS:%s\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\n' "$domain" > "$RUNNER_TEMP/kx/$type.ext"
            openssl x509 -req -in "$RUNNER_TEMP/kx/$type.csr"               -CA "$RUNNER_TEMP/kx/root.crt"               -CAkey "$RUNNER_TEMP/kx/root.key" -CAcreateserial               -out "$RUNNER_TEMP/kx/$type.crt" -days 1 -sha256               -extfile "$RUNNER_TEMP/kx/$type.ext"
            openssl verify -CAfile "$RUNNER_TEMP/kx/root.crt" "$RUNNER_TEMP/kx/$type.crt"
          done
          chmod 600 "$RUNNER_TEMP/kx/"*.key
          echo '127.0.0.1 yori7v7.github.io' | sudo tee -a /etc/hosts > /dev/null
          echo '127.0.0.2 100-30-4-62.nip.io' | sudo tee -a /etc/hosts > /dev/null
          sudo cp "$RUNNER_TEMP/kx/root.crt" /usr/local/share/ca-certificates/kx-runner-temporal.crt
          sudo update-ca-certificates
          certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password || true
          certutil -A -d "sql:$HOME/.pki/nssdb" -n "KX runner root"             -t "C,," -i "$RUNNER_TEMP/kx/root.crt"

      - name: Arrancar FastAPI REAL y SQLite virtual exclusivamente en 127.0.0.2
        shell: bash
        run: |
          set -euo pipefail
          (
            cd backend-kx
            sudo --preserve-env=GITHUB_ACTIONS,KX_CI_LAB,APP_ENV,API_KEY,PUBLIC_VIRTUAL_ADMISSION_ENABLED,PUBLIC_VIRTUAL_ADMISSION_SQLITE_PATH,CONTROL_PUBLICO_ENABLED,CONTROL_PUBLICO_SIMULATION,DEVICE_LAB_ENABLED,KX_SERVER_CRT,KX_SERVER_KEY,RUNNER_TEMP \
              "$(command -v python)" -m scripts.servidor_55kx_https_ci > "$KX_TEST_DIR/backend.log" 2>&1 &
            echo $! > "$KX_TEST_DIR/backend.pid"
          )
          ready=0
          for i in $(seq 1 40); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --noproxy '*'               --cacert "$KX_ROOT_CA" https://100-30-4-62.nip.io/docs || true)"
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "NO-GO K-X: FastAPI HTTPS aislado no arranco."
            cat "$KX_TEST_DIR/backend.log"
            exit 1
          fi
          curl --fail --silent --show-error --noproxy '*'             --cacert "$KX_ROOT_CA" -X OPTIONS             -H 'Origin: https://yori7v7.github.io'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: idempotency-key,x-browser-proposal'             https://100-30-4-62.nip.io/publico/vehiculos/1/solicitudes > /dev/null

      - name: Arrancar la página COMPLETA en el origen Pages HTTPS temporal
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,KX_CI_LAB,KX_PAGES_CRT,KX_PAGES_KEY,RUNNER_TEMP             /usr/bin/python3 -m assets.tests.kx_pages_full_https_ci             > "$KX_TEST_DIR/pages.log" 2>&1 &
          echo $! > "$KX_TEST_DIR/pages.pid"
          ready=0
          for i in $(seq 1 25); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --noproxy '*'               --cacert "$KX_ROOT_CA" https://yori7v7.github.io/control-iot-u4/ || true)"
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "NO-GO K-X: pagina completa HTTPS no arranco."
            cat "$KX_TEST_DIR/pages.log"
            exit 1
          fi

      - name: Chrome real pagina completa profesor/admin con backend real, sin mocks
        run: npx playwright test assets/tests/kx-full-page-contract.spec.js --workers=1

      - name: Limpiar procesos y archivos exclusivamente del runner
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/kx/backend.pid" ]; then
            sudo kill "$(cat "$RUNNER_TEMP/kx/backend.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/kx/pages.pid" ]; then
            sudo kill "$(cat "$RUNNER_TEMP/kx/pages.pid")" 2>/dev/null || true
          fi
          sudo rm -rf "$RUNNER_TEMP/kx"
