name: K-M frontend experimental (sin AWS)
on:
  push:
    branches:
      - feature/5-5k-portal-unico-invitado
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navegador-virtual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar rama experimental
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Pruebas de servicios sin red
        run: npm test
      - name: Navegador Chrome de pruebas
        run: npx playwright install --with-deps chrome
      - name: K-M dos navegadores sin AWS ni motores
        run: npx playwright test assets/tests/guest-admin-km.spec.js --workers=1
